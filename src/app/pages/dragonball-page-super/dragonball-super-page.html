<h1>Página de dragonall</h1>
<hr />

<section class="row">
    <div class="col-12 col-sm-6">
        <input type="text" class="form-control" placeholder="Nombre personaje" [value]="name()"
            (input)="name.set(txtName.value)" #txtName>

        <h3>Power: {{ power() }}</h3>
        <input type="number" class="form-control mt-2" placeholder="Poder del personaje" [value]="power()"
            (input)="power.set(+txtPower.value)" #txtPower>
        <!-- Se agrego una referencia local con el numeral -->

        <button class="mt-2 btn btn-primary" (click)="addCharacter()">Agregar</button>
    </div>

    <div class="col-12 col-sm-6">
        <dragonball-character-list [characters]="characters()">
        </dragonball-character-list>
    </div>
</section>
